<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; width: 320px; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  main { padding: 14px; display: grid; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 15px; }
  .muted { color: GrayText; }
  button { font: inherit; padding: 7px 10px; border-radius: 7px; border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); background: Canvas; color: CanvasText; cursor: pointer; }
  button.primary { background: CanvasText; color: Canvas; border-color: CanvasText; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  #results { display: grid; gap: 6px; }
  .result { display: grid; grid-template-columns: 16px 1fr; gap: 0 6px; }
  .result b { font-weight: 600; } .result span { grid-column: 2; }
  hr { border: 0; border-top: 1px solid color-mix(in srgb, CanvasText 15%, transparent); margin: 0; }
</style>
</head>
<body>
<main>
  <div class="brand"><img src="icons/icon-48.png" width="24" height="24" alt="">coincell</div>
  <div><div id="site"></div><div class="muted" id="hint"></div></div>
  <div class="row">
    <button class="primary" id="send">Send this site</button>
    <button id="send-all">Send all open sites</button>
  </div>
  <div id="results" role="status"></div>
  <hr>
  <div>
    <div class="row"><button id="record">Start recording this site</button></div>
    <div class="muted" id="record-hint">Recording teaches coincell how a new site is built. It keeps the layout of pages and data, never the values.</div>
  </div>
  <div class="muted" id="version"></div>
</main>
<script type="module" src="popup.js"></script>
</body>
</html>
